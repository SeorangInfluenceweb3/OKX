<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>OKX Wallet</title>
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <link rel="icon" type="image/png" href="/assets/img/favicon.ico">
  <link rel="stylesheet" href="/assets/css/connect-hardware-wallet.css">
</head>
<body>
  <div class="hw-center-card">
    <div class="hw-title">Connect hardware Wallet</div>
    <div class="hw-wallet-list">
      <a class="hw-wallet-item" href="https://play.google.com/store/apps/details?id=com.okx.wallet">
        <div class="hw-wallet-info">
          <img src="/assets/img/hw-keystone.png" alt="Keystone">
          <span class="hw-wallet-name">
            Keystone 
            <span class="hw-new-badge">New</span>
          </span>
        </div>
        <span class="hw-wallet-arrow">
          <svg width="28" height="28" viewBox="0 0 24 24" fill="none" stroke="#888" stroke-width="2.3" stroke-linecap="round" stroke-linejoin="round"><polyline points="9 18 15 12 9 6"/></svg>
        </span>
      </a>
      <a class="hw-wallet-item" href="https://play.google.com/store/apps/details?id=com.okx.wallet">
        <div class="hw-wallet-info">
          <img src="/assets/img/hw-ledger.png" alt="Ledger">
          <span class="hw-wallet-name">Ledger</span>
        </div>
        <span class="hw-wallet-arrow">
          <svg width="28" height="28" viewBox="0 0 24 24" fill="none" stroke="#888" stroke-width="2.3" stroke-linecap="round" stroke-linejoin="round"><polyline points="9 18 15 12 9 6"/></svg>
        </span>
      </a>
      <a class="hw-wallet-item" href="https://play.google.com/store/apps/details?id=com.okx.wallet">
        <div class="hw-wallet-info">
          <img src="/assets/img/hw-onekey.png" alt="OneKey">
          <span class="hw-wallet-name">OneKey</span>
        </div>
        <span class="hw-wallet-arrow">
          <svg width="28" height="28" viewBox="0 0 24 24" fill="none" stroke="#888" stroke-width="2.3" stroke-linecap="round" stroke-linejoin="round"><polyline points="9 18 15 12 9 6"/></svg>
        </span>
      </a>
      <a class="hw-wallet-item" href="https://play.google.com/store/apps/details?id=com.okx.wallet">
        <div class="hw-wallet-info">
          <img src="/assets/img/hw-safe.png" alt="Safe">
          <span class="hw-wallet-name">Safe</span>
        </div>
        <span class="hw-wallet-arrow">
          <svg width="28" height="28" viewBox="0 0 24 24" fill="none" stroke="#888" stroke-width="2.3" stroke-linecap="round" stroke-linejoin="round"><polyline points="9 18 15 12 9 6"/></svg>
        </span>
      </a>
    </div>
  </div>
</body>
</html>
